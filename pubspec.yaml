name: hyphen_app
description: "WOD pacing strategy app"
publish_to: 'none'
# H-3 (2026-06-10): 론칭 버전. versionCode 3001 (구 0.1.17+3000 에서 단조 증가 유지).
# 3002 (2026-08-13): 가입 코드 폐기 · 없는 기능 광고 제거 · 전화번호 자동 하이픈 반영.
# 3004 (2026-08-13): 승인 전 앱 전체 차단 + 가입 신청서 확대(경력·종목·부상 이력).
version: 1.0.0+3037

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  # v3.3 (2026-08-21): 날짜·시간 다이얼로그 한글화 — Material 기본 문자열
  # (Select date·Cancel·OK)이 영문으로 나오던 것을 ko 로케일로 교체.
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # 시각 주입 지점 단일화 — DateTime.now() 직접 호출 금지, clock.now() 만.
  # 골든 테스트가 flutter_test_config 에서 Clock.fixed 로 날짜를 고정한다.
  clock: ^1.1.1
  dio: ^5.7.0
  shared_preferences: ^2.3.2
  uuid: ^4.5.1
  provider: ^6.1.2
  connectivity_plus: ^6.0.5
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  wakelock_plus: ^1.2.8
  # /go Phase 3: SNS 공유 (WOD 결과 카드 텍스트 공유).
  share_plus: ^10.0.0
  # v1.19 P2: 공지 CTA 외부 링크 열기.
  url_launcher: ^6.3.1
  # D26 소셜 로그인 (네이버·구글). 토큰은 백엔드 /api/v1/auth/social 서버검증.
  # 활성화: --dart-define=USE_REAL_AUTH=true (미지정 시 StubSocialAuthService).
  # PHASE5: 사장 폰 로그인 — 쿠키 세션 관리 + 보안 토큰 저장
  dio_cookie_manager: ^3.1.1
  cookie_jar: ^4.0.8
  flutter_secure_storage: ^9.2.2
  # v1.17 로컬 푸시 — Firebase 없는 자체 알림 (SSE + Foreground Service + 로컬 노티)
  flutter_local_notifications: ^17.2.3
  permission_handler: ^11.3.1
  # 예약 수업 1시간 전 알림(zonedSchedule)이 쓰는 시간대 DB. flutter_local_notifications
  # 가 이미 끌어오지만, 직접 import 하므로 명시 의존으로 적는다 (2026-08-28).
  timezone: ^0.9.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true

  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/PretendardVariable.ttf
          weight: 400
        - asset: assets/fonts/PretendardVariable.ttf
          weight: 700

  assets:
    - assets/images/
    # 캐릭터 전용 폴더 (2026-08-21 사용자 지시) — 사용자가 직접 허용한 그림만
    # assets/character/ 에 들어간다. 규칙·파일명 표 = 그 폴더의 README.md.
    # 2026-08-21 — 사용자가 지정한 표정 3장 도착 (HYPEE 표정시트에서 발췌).
    - assets/character/
    # 스플래시 등장 연출용 전신 액션 11종 (2026-08-21). 스낵바 3장과 성격이 달라
    # 하위 폴더로 분리한다 — 규칙 = assets/character/README.md.
    # 2.0x·3.0x 는 Flutter 가 배율 변형으로 자동 인식하므로 따로 적지 않는다.
    - assets/character/action/
    # 마감·인사 전신 6종 (2026-09-04). 액션 11종이 전부 운동 동작이라 감사·배웅·마감을
    # 표현할 컷이 없어 따로 받은 한 벌 — 스플래시 연출과 섞이면 등장 순서가 깨진다.
    # 정본 = C:/dev/services/design/_작업/앱에셋/flutter (여기 있는 건 사본)
    - assets/character/greeting/
    # 업적 픽토그램 55종 (2026-08-21) — hyphen-achievement-pack v1.0.
    # 정본·매핑·재생성 = C:/dev/services/design/hyphen-achievement-pack
    - assets/pictograms/
    - assets/textures/
    # assets/icons/ 제거 (v1.27) — 스틱맨 svg 폐기로 빈 폴더
    - assets/data/rehab/
